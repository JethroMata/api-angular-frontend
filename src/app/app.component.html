<div class="app-container" [ngClass]="{ 'bg-light': account }">
    <!-- main nav -->
    <nav class="navbar navbar-expand navbar-dark bg-dark px-3" *ngIf="account">
        <div class="navbar-nav me-auto">
            <!-- Left side -->
            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item nav-link">Home</a>
            <a routerLink="/profile" routerLinkActive="active" class="nav-item nav-link">Profile</a>
             <!-- Admin only -->
             <a *ngIf="account.role === Role.Admin" routerLink="/admin" routerLinkActive="active" class="nav-item nav-link">Admin</a>
             <div class="navbar-nav ms-auto">
            <!-- <a routerLink="/accounts" *ngIf="account.role === Role.Admin" routerLinkActive="active" class="nav-item nav-link">Accounts</a> -->
            <a routerLink="/employees" *ngIf="account.role === Role.Admin || Role.User"routerLinkActive="active" class="nav-item nav-link">Employees</a>
            <a routerLink="/departments" *ngIf="account.role === Role.Admin || Role.User"routerLinkActive="active" class="nav-item nav-link">Departments</a>
            <a routerLink="/requests" *ngIf="account.role === Role.Admin || Role.User"routerLinkActive="active" class="nav-item nav-link">Requests</a>
            <a routerLink="/positions" *ngIf="account.role === Role.Admin || Role.User"routerLinkActive="active" class="nav-item nav-link">Positions</a>
        </div>      
             <button (click)="logout()" class="btn btn-link nav-item nav-link">Logout</button>
        </div>
            
        <!-- ✅ Right side (User only) -->
        <!-- <div class="navbar-nav ms-auto"> -->
            <!-- <a routerLink="/accounts" *ngIf="account.role === Role.Admin" routerLinkActive="active" class="nav-item nav-link">Accounts</a> -->
            <!-- <a routerLink="/employees" *ngIf="account.role === Role.Admin || Role.User"routerLinkActive="active" class="nav-item nav-link">Employees</a>
            <a routerLink="/departments" *ngIf="account.role === Role.Admin || Role.User"routerLinkActive="active" class="nav-item nav-link">Departments</a>
            <a routerLink="/requests" *ngIf="account.role === Role.Admin || Role.User"routerLinkActive="active" class="nav-item nav-link">Requests</a>
        </div>       -->
    </nav>

    <!-- subnav router outlet -->
    <router-outlet name="subnav"></router-outlet>

    <!-- global alert -->
    <alert></alert>

    <!-- main router outlet -->
    <router-outlet></router-outlet>
</div>
