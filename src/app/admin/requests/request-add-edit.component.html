<div class="card mt-3">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h5>{{ isAddMode ? 'Add Request' : 'Edit Request' }}</h5>
    <button class="btn btn-secondary btn-sm" routerLink="/admin/requests">← Back</button>
  </div>

  <div class="card-body">
    <form [formGroup]="form">
      <!-- Type -->
      <div class="mb-3">
        <label for="type" class="form-label">Type</label>
        <select formControlName="type" id="type" class="form-select">
          <option value="">-- Select Type --</option>
          <option value="equipment">Equipment</option>
          <option value="leave">Leave</option>
          <option value="resources">Resources</option>
        </select>
      </div>

      <!-- Items -->
      <div class="mb-3">
        <label for="items" class="form-label">Items</label>
        <input id="items" type="text" formControlName="items" class="form-control" />
      </div>

      <!-- Quantity -->
      <div class="mb-3">
        <label for="quantity" class="form-label">Quantity</label>
        <input id="quantity" type="number" formControlName="quantity" class="form-control" min="1" />
      </div>

      <!-- Status -->
      <div class="mb-3">
        <label for="status" class="form-label">Status</label>
        <input id="status" type="text" formControlName="status" class="form-control" readonly />
      </div>

      <!-- Status Alert -->
      <div *ngIf="statusMessage" class="alert mt-3" [ngClass]="'alert-' + statusColor">
        {{ statusMessage }}
      </div>

      <!-- Buttons -->
      <div class="mt-3 d-flex justify-content-end gap-2">
        <button
          *ngIf="canEdit"
          type="button"
          class="btn btn-primary"
          (click)="saveDraft()"
          [disabled]="loading"
        >
          {{ isAddMode ? 'Create' : 'Update' }}
        </button>

        <button
          *ngIf="canEdit"
          type="button"
          class="btn btn-success"
          (click)="submitForApproval()"
          [disabled]="loading"
        >
          Submit for Approval
        </button>
      </div>
    </form>
  </div>
</div>
