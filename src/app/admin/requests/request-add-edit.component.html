<div class="card mt-3">
  <div class="card-header">
    <h5>{{ isAddMode ? 'Add Request' : 'Edit Request' }}</h5>
  </div>
  <div class="card-body">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">

      <!-- Employee Email (readonly in edit mode, dropdown in add mode) -->
      <div class="mb-3">
        <label for="employee">Employee</label>

        <!-- Add Mode -->
        <select *ngIf="isAddMode" formControlName="employeeId" id="employee" class="form-select">
          <option value="">Select Employee</option>
          <option *ngFor="let emp of employees" [value]="emp.Account?.id">
            {{ emp.Account?.email }}
          </option>
        </select>

        <!-- Edit Mode -->
        <input 
          *ngIf="!isAddMode"
          type="text"
          class="form-control"
          [value]="employeeEmail"
          readonly
        />
      </div>

      <!-- Type -->
      <div class="mb-3">
        <label for="type">Type</label>
        <select formControlName="type" id="type" class="form-select">
          <option value="">Select Type</option>
          <option value="equipment">Equipment</option>
          <option value="leave">Leave</option>
          <option value="resources">Resources</option>
        </select>
      </div>

      <!-- Status (only edit mode) -->
      <div class="mb-3" *ngIf="!isAddMode">
        <label for="status">Status</label>
        <select formControlName="status" id="status" class="form-select">
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
          <option value="rejected">Rejected</option>
        </select>
      </div>

      <!-- Items -->
      <div formArrayName="items" class="mb-3">
        <label>Items</label>
        <div *ngFor="let item of itemsFormArray.controls; let i = index" [formGroupName]="i" class="row g-2 mb-2">
          <div class="col">
            <input type="text" formControlName="name" class="form-control" placeholder="Item Name" />
          </div>
          <div class="col">
            <input type="number" formControlName="quantity" class="form-control" placeholder="Quantity" min="1" />
          </div>
          <div class="col-auto">
            <button type="button" class="btn btn-danger" (click)="removeItem(i)" [disabled]="itemsFormArray.length === 1">
              Remove
            </button>
          </div>
        </div>
      </div>

      <!-- Add Item Button -->
      <button type="button" class="btn btn-secondary mt-2" (click)="addItem()">Add Item</button>

      <!-- Submit -->
      <div class="mt-3">
        <button type="submit" class="btn btn-primary me-2" [disabled]="loading">
          {{ isAddMode ? 'Save' : 'Update' }}
        </button>
        <a routerLink="/admin/requests" class="btn btn-secondary">Cancel</a>
      </div>

    </form>
  </div>
</div>
