<div class="card mt-3">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h5>Requests Pending for Approval</h5>
    <button class="btn btn-secondary btn-sm" routerLink="/admin/requests">Back</button>
  </div>

  <div class="card-body">
    <table class="table table-striped">
      <thead>
        <tr>
          <th>ID</th>
          <th>Requester</th>
          <th>Type</th>
          <th>Items</th>
          <th>Quantity</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let r of requests">
          <td>{{ r.requestId }}</td>
          <td>{{ r.Account?.firstName }} {{ r.Account?.lastName }}</td>
          <td>{{ r.type }}</td>
          <td>{{ r.items }}</td>
          <td>{{ r.quantity }}</td>
          <td>
            <span
              class="badge"
              [ngClass]="{
                'bg-warning text-dark': r.status === 'pending',
                'bg-success': r.status === 'approved',
                'bg-danger': r.status === 'rejected'
              }">
              {{ r.status.toUpperCase() }}
            </span>
          </td>
          <td>
            <button
              class="btn btn-success btn-sm me-1"
              *ngIf="r.status === 'pending'"
              (click)="approve(r.requestId)">
              Approve
            </button>
            <button
              class="btn btn-danger btn-sm"
              *ngIf="r.status === 'pending'"
              (click)="reject(r.requestId)">
              Reject
            </button>
          </td>
        </tr>
        <tr *ngIf="requests.length === 0">
          <td colspan="7" class="text-center text-muted">No pending requests found.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
