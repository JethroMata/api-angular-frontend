<div class="content-wrapper">
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h3>Employee Workflow: {{ employeeId }}</h3>
      <button class="btn btn-secondary btn-sm" (click)="backToEmployees()">← Back</button>
    </div>

    <div *ngIf="loading" class="text-center p-3">
      Loading workflow...
    </div>

    <table *ngIf="!loading && workflows.length > 0" class="table table-striped">
      <thead>
        <tr>
          <th>Action</th>
          <th>Description</th>
          <th>Date / Time</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let wf of workflows">
          <td>{{ wf.action }}</td>
          <td>{{ wf.description }}</td>
          <td>{{ wf.createdAt | date:'short' }}</td>
        </tr>
      </tbody>
    </table>

    <div *ngIf="!loading && workflows.length === 0" class="p-3 text-center">
      No workflow records found.
    </div>
  </div>
</div>
