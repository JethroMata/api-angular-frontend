<div class="content-wrapper">
  
  <div class="list-container">
    <h2>ACCOUNTS</h2>

    <div class="header-row">
      <a routerLink="add" class="btn add-button">Create Account</a>
    </div>

    <table class="data-table">
        <thead>
            <tr>
                <th>Title</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Status</th>
                <th class="action-cell">Action</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let account of accounts">
                <td>{{account.title}}</td> 
                <td>{{account.firstName}}</td>
                <td>{{account.lastName}}</td>
                <td>{{account.email}}</td>
                <td>{{account.role}}</td>
                <td>
                  <span class="status-badge"
                                [ngClass]="{
                      'status-active': account.status.toUpperCase() === 'ACTIVE',
                       'status-inactive': account.status.toUpperCase() !== 'ACTIVE'
                            }">
                                 {{ account.status }}
                  </span>
                </td>
                <td class="action-cell">
                    <a routerLink="edit/{{account.id}}" class="btn action-btn btn-edit">Edit</a>
                </td>
            </tr>
            <tr *ngIf="!accounts">
                <td colspan="7" class="text-center">
                    <span class="spinner-border spinner-border-lg align-center"></span>
                </td>
            </tr>
        </tbody>
    </table>

    
  </div>
</div>
