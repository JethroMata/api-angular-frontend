<div class="content-wrapper">
  <div class="card employee-list-card">
    <h2>{{ title }}</h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Role Type</label>
        <input type="text" formControlName="roleType" class="form-control" placeholder="Enter role type">
        <div *ngIf="form.get('roleType')?.touched && form.get('roleType')?.invalid" class="text-danger">
          Role Type is required
        </div>
      </div>

      
      <div class="form-group">
  <label>Status</label>
  <select formControlName="status" class="form-control">
    <option value="">Select status</option>
    <option value="active">Active</option>
    <option value="inactive">Inactive</option>
  </select>
  <div *ngIf="form.get('status')?.touched && form.get('status')?.invalid" class="text-danger">
    Status is required
  </div>
</div>

      <div class="button-row" style="margin-top: 15px;">
        <button class="btn btn-primary" [disabled]="submitting">{{ id ? 'Update' : 'Save' }}</button>
        <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
      </div>

    </form>
  </div>
</div>
